name: CI

# Kept deliberately small (Anicel's account was suspended after ~130 runs a day
# plus a nightly macOS runner, 2026-09). Push = analyze/test + the Galaxy Tab
# APK. Desktop and Apple builds run only when dispatched by hand. No cron.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      desktop:
        description: 'Also build Windows, Linux, macOS and iOS'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      # Sideload onto the Galaxy Tab straight from the run page.
      - uses: actions/upload-artifact@v4
        with:
          name: anisched-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --debug

  windows:
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --debug

  apple:
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --debug
      - run: flutter build ios --debug --simulator --no-codesign
