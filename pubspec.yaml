name: anisched
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  sqlite3: ^3.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The desktop start screen's picture (drawn by tool/app_art; the
  # runners read it from the app's assets).
  assets:
    - assets/app_art/splash.png
  # BIZ UDPGothic carries Latin and Japanese; Nanum Gothic fills in Hangul;
  # Noto Sans SC (Adobe/Google subset OTF) draws Simplified Chinese and
  # leads when the app is in Chinese so Han characters take SC forms.
  # All SIL OFL 1.1 (licences next to the files), bundled so the app
  # renders the same offline on every platform.
  fonts:
    - family: BIZUDPGothic
      fonts:
        - asset: assets/fonts/BIZUDPGothic-Regular.ttf
        - asset: assets/fonts/BIZUDPGothic-Bold.ttf
          weight: 700
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
